<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura RNG Simulator - 300 Dynamic Auras Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030305;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* Header Area */
        header {
            text-align: center;
            margin-top: 5px;
            width: 100%;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #a855f7, #ec4899, #3b82f6, #eab308);
            background-size: 300% 300%;
            animation: gradientShift 6s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .user-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .nickname-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            cursor: pointer;
            color: #38bdf8;
            font-weight: bold;
            transition: all 0.2s;
        }

        .nickname-badge:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            font-size: 0.85rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stat-item span {
            color: #fbbf24;
            font-weight: bold;
        }

        /* Dynamic Aura Display Area */
        .aura-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            position: relative;
        }

        .aura-visual {
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
        }

        /* 1. Tier 1: Soft Floating Essence Core */
        .aura-visual.tier-1 {
            border-radius: 50%;
        }

        .aura-visual.tier-1 .aura-core {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            animation: pulseGlow 2.5s ease-in-out infinite alternate;
        }

        /* 2. Tier 2: Spinning Diamond Matrix */
        .aura-visual.tier-2 {
            border-radius: 20%;
            animation: slowRotate 10s linear infinite;
        }

        .aura-visual.tier-2::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            border: 2px dashed var(--aura-color, #fff);
            border-radius: 25%;
            animation: slowRotate 12s linear infinite reverse;
            opacity: 0.6;
        }

        .aura-visual.tier-2 .aura-core {
            width: 75px;
            height: 75px;
            transform: rotate(45deg);
            border-radius: 12px;
            animation: pulseGlow 1.8s ease-in-out infinite alternate;
        }

        /* 3. Tier 3: Radiant Star & Energy Rays */
        .aura-visual.tier-3 {
            border-radius: 50%;
        }

        .aura-visual.tier-3::before {
            content: '';
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            border: 3px solid var(--aura-color, #fff);
            box-shadow: 0 0 25px var(--aura-glow, #fff), inset 0 0 25px var(--aura-glow, #fff);
            animation: ringExpand 2.5s ease-in-out infinite alternate;
        }

        .aura-visual.tier-3 .aura-core {
            width: 85px;
            height: 85px;
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            animation: fastRotate 6s linear infinite, starPulse 1.5s ease-in-out infinite alternate;
        }

        /* 4. Tier 4: Cosmic God Dual Orbital Halo */
        .aura-visual.tier-4 {
            border-radius: 50%;
        }

        .aura-visual.tier-4::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            border: 3px dashed var(--aura-color, #fff);
            border-radius: 50%;
            animation: ringRotate 6s linear infinite;
            box-shadow: 0 0 35px var(--aura-glow, #fff);
        }

        .aura-visual.tier-4::before {
            content: '';
            position: absolute;
            width: 280px;
            height: 280px;
            border: 2px dotted var(--aura-glow, #fff);
            border-radius: 50%;
            animation: fastRotate 10s linear infinite reverse;
            filter: drop-shadow(0 0 15px var(--aura-color, #fff));
        }

        .aura-visual.tier-4 .aura-core {
            width: 95px;
            height: 95px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: fastRotate 3s linear infinite;
        }

        /* 5. Tier 5: DIVINE OMNI DEITY REALM (New Ultra Celestial Effect) */
        .aura-visual.tier-5 {
            border-radius: 50%;
            animation: divineFloat 3s ease-in-out infinite alternate;
        }

        .aura-visual.tier-5::after {
            content: '';
            position: absolute;
            width: 280px;
            height: 280px;
            border: 4px double var(--aura-color, #fff);
            border-radius: 50%;
            animation: ringRotate 4s linear infinite;
            box-shadow: 0 0 50px var(--aura-glow, #fff), inset 0 0 30px var(--aura-color, #fff);
        }

        .aura-visual.tier-5::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            clip-path: polygon(50% 0%, 80% 10%, 100% 35%, 100% 70%, 80% 90%, 50% 100%, 20% 90%, 0% 70%, 0% 35%, 20% 10%);
            border: 2px solid var(--aura-glow, #fff);
            animation: slowRotate 8s linear infinite reverse;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 40px var(--aura-glow, #fff);
        }

        .aura-visual.tier-5 .aura-core {
            width: 110px;
            height: 110px;
            clip-path: polygon(50% 0%, 63% 28%, 95% 25%, 75% 50%, 95% 75%, 63% 72%, 50% 100%, 37% 72%, 5% 75%, 25% 50%, 5% 25%, 37% 28%);
            animation: fastRotate 2s linear infinite, godPulse 1s ease-in-out infinite alternate;
        }

        .aura-core {
            background: #fff;
            box-shadow: 0 0 40px #fff;
            position: relative;
            z-index: 2;
            transition: all 0.5s ease;
        }

        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fastRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes ringRotate {
            from { transform: rotate(0deg) scale(0.95); }
            50% { transform: rotate(180deg) scale(1.08); }
            to { transform: rotate(360deg) scale(0.95); }
        }

        @keyframes ringExpand {
            0% { transform: scale(0.85); opacity: 0.4; }
            100% { transform: scale(1.15); opacity: 0.95; }
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.92); opacity: 0.6; }
            100% { transform: scale(1.18); opacity: 0.95; }
        }

        @keyframes starPulse {
            0% { transform: scale(0.9) rotate(0deg); }
            100% { transform: scale(1.25) rotate(180deg); }
        }

        @keyframes godPulse {
            0% { transform: scale(0.9) rotate(0deg); filter: brightness(1); }
            100% { transform: scale(1.3) rotate(360deg); filter: brightness(1.6); }
        }

        @keyframes divineFloat {
            0% { transform: translateY(-8px); }
            100% { transform: translateY(8px); }
        }

        .aura-info {
            text-align: center;
            z-index: 5;
        }

        .equipped-tag {
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #10b981;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .aura-name {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(0,0,0,0.9);
            transition: color 0.3s ease;
            line-height: 1.1;
        }

        .aura-rarity {
            font-size: 1.15rem;
            font-weight: 800;
            color: #e5e7eb;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 20px;
            border-radius: 14px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        /* Controls Area */
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 440px;
            margin-bottom: 10px;
        }

        .cooldown-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .cooldown-bar {
            width: 0%;
            height: 100%;
            background: #3b82f6;
            transition: width 0.05s linear;
        }

        .btn-main {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 16px 24px;
            font-size: 1.25rem;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4), inset 0 2px 0 rgba(255,255,255,0.3);
            transition: all 0.15s ease;
            width: 100%;
            text-align: center;
        }

        .btn-main:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            width: 100%;
        }

        .btn-sub {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 10px;
            font-size: 0.9rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-auto.active {
            background: linear-gradient(135deg, #059669, #047857);
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 95%;
            max-width: 880px;
            max-height: 85vh;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f3f4f6;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }

        .search-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 8px 12px;
            color: white;
            margin-bottom: 12px;
            width: 100%;
            font-size: 0.9rem;
        }

        .search-box:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Collection Grid */
        .collection-list {
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            padding-right: 5px;
        }

        .collection-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .collection-card.unlocked {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .collection-card.locked {
            opacity: 0.25;
            filter: grayscale(1);
        }

        .card-name {
            font-size: 0.8rem;
            font-weight: 800;
            margin-top: 6px;
            line-height: 1.2;
        }

        .card-rarity {
            font-size: 0.68rem;
            color: #9ca3af;
            margin-top: 3px;
        }

        .card-count {
            position: absolute;
            top: 5px;
            right: 6px;
            font-size: 0.65rem;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 8px;
            color: #fbbf24;
            font-weight: bold;
        }

        /* Leaderboard */
        .leaderboard-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .lb-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
        }

        .lb-item.top1 {
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.15), rgba(0,0,0,0.4));
            border-color: #fbbf24;
        }

        .lb-item.top2 {
            background: linear-gradient(90deg, rgba(226, 232, 240, 0.15), rgba(0,0,0,0.4));
            border-color: #94a3b8;
        }

        .lb-item.top3 {
            background: linear-gradient(90deg, rgba(217, 119, 6, 0.15), rgba(0,0,0,0.4));
            border-color: #d97706;
        }

        .lb-rank {
            font-weight: 900;
            width: 35px;
            font-size: 1.1rem;
        }

        .lb-rank.r1 { color: #fbbf24; }
        .lb-rank.r2 { color: #cbd5e1; }
        .lb-rank.r3 { color: #f59e0b; }

        .lb-user {
            flex-grow: 1;
            font-weight: 800;
            color: #f3f4f6;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .lb-aura {
            text-align: right;
            font-weight: 800;
        }

        .lb-rarity {
            font-size: 0.75rem;
            color: #9ca3af;
            display: block;
        }

        /* Cutscene Overlay */
        #cutsceneOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #cutsceneOverlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .cutscene-text {
            font-size: 3.2rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 4px;
            animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            padding: 0 20px;
        }

        .cutscene-sub {
            font-size: 1.5rem;
            margin-top: 15px;
            color: #fbbf24;
            opacity: 0;
            animation: fadeIn 0.5s ease 0.6s forwards;
            font-weight: 800;
        }

        @keyframes zoomIn {
            0% { transform: scale(0.1); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }

        @keyframes shakeAnim {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-10px, 6px); }
            40% { transform: translate(10px, -6px); }
            60% { transform: translate(-6px, 4px); }
            80% { transform: translate(6px, -4px); }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <header>
            <h1>AURA RNG</h1>
            <div class="user-bar">
                <div class="nickname-badge" id="btnChangeNickname">👤 Player: <span id="lblNickname">Player123</span></div>
            </div>
            <div class="stats-bar">
                <div class="stat-item">총 뽑기: <span id="statTotalRolls">0</span>회</div>
                <div class="stat-item">수집률: <span id="statCollectionRate">0/300</span></div>
                <div class="stat-item">최고 기록: <span id="statBestRarity">1/2</span></div>
            </div>
        </header>

        <div class="aura-display">
            <div class="aura-visual tier-1" id="auraVisual">
                <div class="aura-core" id="auraCore"></div>
            </div>
            <div class="aura-info">
                <div class="equipped-tag">EQUIPPED AURA</div>
                <div class="aura-name" id="auraName">Common</div>
                <div class="aura-rarity" id="auraRarity">1 / 2</div>
            </div>
        </div>

        <div class="controls">
            <div class="cooldown-bar-container">
                <div class="cooldown-bar" id="cooldownBar"></div>
            </div>
            
            <button class="btn-main" id="btnRoll">ROLL (0.5s)</button>
            
            <div class="btn-group">
                <button class="btn-sub btn-auto" id="btnAuto">AUTO: OFF</button>
                <button class="btn-sub" id="btnOpenCollection">도감 (0/300)</button>
                <button class="btn-sub" id="btnOpenLeaderboard" style="border-color: #f59e0b; color: #fbbf24;">🏆 랭킹 (TOP 10)</button>
            </div>
        </div>
    </div>

    <!-- Collection Modal -->
    <div class="modal" id="collectionModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="collectionTitle">Aura Collection</div>
                <button class="close-btn" id="btnCloseCollection">&times;</button>
            </div>
            <input type="text" class="search-box" id="searchCollection" placeholder="아우라 이름 검색...">
            <div class="collection-list" id="collectionList"></div>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🏆 Global Leaderboard (TOP 10)</div>
                <button class="close-btn" id="btnCloseLeaderboard">&times;</button>
            </div>
            <div class="leaderboard-list" id="leaderboardList"></div>
        </div>
    </div>

    <!-- Cutscene Overlay -->
    <div id="cutsceneOverlay">
        <div class="cutscene-text" id="cutsceneText">STARLIGHT</div>
        <div class="cutscene-sub" id="cutsceneSub">1 / 1,000,000</div>
    </div>

    <script>
        /* ==========================================================================

        const prefixes = ['Lesser', 'Pure', 'Ancient', 'Radiant', 'Starlight', 'Phantom', 'Cosmic', 'Mythic', 'Divine', 'Ultimate', 'Supreme', 'Absolute', 'Infinite', 'Ethereal', 'Hyper', 'Celestial', 'Abyssal', 'Chrono'];
        const suffixes = ['II', 'III', 'IV', 'V', 'Prime', 'Unbound', 'Awakened', 'Overdrive', 'Zero', 'EX', 'Omega', 'Alpha', 'Nova', 'Sovereign', 'Unchained'];

        const colors = [
            { main: '#a1a1aa', glow: '#d4d4d8' }, { main: '#4ade80', glow: '#22c55e' },
            { main: '#60a5fa', glow: '#3b82f6' }, { main: '#facc15', glow: '#eab308' },
            { main: '#38bdf8', glow: '#0284c7' }, { main: '#a855f7', glow: '#9333ea' },
            { main: '#34d399', glow: '#059669' }, { main: '#e0f2fe', glow: '#38bdf8' },
            { main: '#f59e0b', glow: '#d97706' }, { main: '#fb923c', glow: '#ea580c' },
            { main: '#f43f5e', glow: '#e11d48' }, { main: '#2563eb', glow: '#1d4ed8' },
            { main: '#818cf8', glow: '#4f46e5' }, { main: '#84cc16', glow: '#65a30d' },
            { main: '#ff6600', glow: '#cc5200' }, { main: '#fef08a', glow: '#eab308' },
            { main: '#10b981', glow: '#047857' }, { main: '#a5f3fc', glow: '#0891b2' },
            { main: '#ef4444', glow: '#b91c1c' }, { main: '#ec4899', glow: '#be185d' }
        ];

        function generate300Auras() {
            const list = [];
            const TOTAL = 300;
            const minLog = Math.log(2);
            const maxLog = Math.log(100000000);

            for (let i = 0; i < TOTAL; i++) {
                let chance;
                if (i === 0) {
                    chance = 2;
                } else if (i === TOTAL - 1) {
                    chance = 100000000;
                } else {
                    const ratio = i / (TOTAL - 1);
                    chance = Math.round(Math.exp(minLog + ratio * (maxLog - minLog)));
                }

                let name = '';
                if (i < baseNames.length) {
                    name = baseNames[i];
                } else {
                    const p = prefixes[i % prefixes.length];
                    const b = baseNames[i % baseNames.length];
                    const s = suffixes[(i + Math.floor(i / prefixes.length)) % suffixes.length];
                    name = `${p} ${b} ${s}`;
                }

                const colorObj = colors[i % colors.length];
                
                // Tier Level for Distinct Visual Geometry & VFX (Tiers 1 to 5)
                let tier = 1;
                if (chance >= 20000000) tier = 5;      // Divine Deity Tier (Ultra High VFX)
                else if (chance >= 1000000) tier = 4;  // Cosmic God Orbit
                else if (chance >= 50000) tier = 3;    // Radiant Star Core
                else if (chance >= 500) tier = 2;      // Diamond Matrix

                const particleSpeed = 0.5 + tier * 0.9;
                const particleSizeMax = 2 + tier * 2.5;
                const particles = Math.min(12 + tier * 30, 300);

                list.push({
                    id: `aura_${i + 1}`,
                    name: name,
                    chance: chance,
                    color: colorObj.main,
                    glow: colorObj.glow,
                    particles: particles,
                    particleSpeed: particleSpeed,
                    particleSizeMax: particleSizeMax,
                    tier: tier,
                    cutscene: chance >= 100000
                });
            }
            return list;
        }

        const RAW_AURAS = generate300Auras();
        const AURAS = RAW_AURAS.sort((a, b) => b.chance - a.chance);

        /* ==========================================================================
           2. State & Storage Management
           ========================================================================== */
        let nickname = localStorage.getItem('aura_rng_300_nick') || ('User' + Math.floor(1000 + Math.random() * 9000));
        let totalRolls = parseInt(localStorage.getItem('aura_rng_300_rolls') || '0');
        let inventory = JSON.parse(localStorage.getItem('aura_rng_300_inv') || '{}');
        let autoRoll = false;
        let isRolling = false;

        AURAS.forEach(a => { if (!inventory[a.id]) inventory[a.id] = 0; });

        function getBestUnlockedAura() {
            for (let a of AURAS) {
                if (inventory[a.id] > 0) return a;
            }
            return AURAS[AURAS.length - 1];
        }

        let equipped = getBestUnlockedAura();
        if (inventory[equipped.id] === 0) inventory[equipped.id] = 1;

        function saveData() {
            localStorage.setItem('aura_rng_300_nick', nickname);
            localStorage.setItem('aura_rng_300_rolls', totalRolls.toString());
            localStorage.setItem('aura_rng_300_inv', JSON.stringify(inventory));
        }

        /* ==========================================================================
           3. Web Audio System
           ========================================================================== */
        let audioCtx = null;
        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'roll') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(280, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'upgrade') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'jackpot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.8);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                }
            } catch(e) {}
        }

        /* ==========================================================================
           4. Enhanced Dynamic Background Canvas Engine
           ========================================================================== */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DynamicParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                
                const maxS = equipped.particleSizeMax || 3;
                this.size = Math.random() * maxS + 1;
                
                const spd = equipped.particleSpeed || 1;
                this.speedX = (Math.random() - 0.5) * spd * (equipped.tier >= 4 ? 2 : 1);
                this.speedY = -Math.random() * spd * 1.8; // Dynamic upward aura flame flow
                this.alpha = Math.random() * 0.8 + 0.2;
                this.angle = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.rotSpeed;

                if (this.x < 0 || this.x > canvas.width || this.y < 0) {
                    this.reset();
                    this.y = canvas.height;
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = equipped.color;
                ctx.shadowBlur = 12 + equipped.tier * 8;
                ctx.shadowColor = equipped.glow;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.beginPath();
                if (equipped.tier === 5) {
                    // Divine Spark Diamond particles
                    ctx.moveTo(0, -this.size * 2);
                    ctx.lineTo(this.size, 0);
                    ctx.lineTo(0, this.size * 2);
                    ctx.lineTo(-this.size, 0);
                    ctx.closePath();
                } else if (equipped.tier >= 3) {
                    // Star & Crystal particles for high tiers
                    ctx.rect(-this.size, -this.size, this.size * 2, this.size * 2);
                } else {
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                }
                
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(equipped.particles || 20, 200);
            for (let i = 0; i < count; i++) {
                particles.push(new DynamicParticle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        initParticles();
        animateParticles();

        /* ==========================================================================
           5. Leaderboard Syncing
           ========================================================================== */
        let localLeaderboard = [
            { name: "AuraGod", aura: "ABSOLUTE UNIVERSE", chance: 100000000 },
            { name: "SolMaster", aura: "AURA DEITY", chance: 85000000 },
            { name: "VoidKing", aura: "SOL PRIME", chance: 70000000 },
            { name: "SovereignKing", aura: "Void Emperor", chance: 50000000 },
            { name: "AbyssalHunter", aura: "Quantum Multiverse", chance: 35000000 },
            { name: "MatrixMaster", aura: "Aetherius Supreme", chance: 20000000 },
            { name: "GalacticHero", aura: "Nirvana Realized", chance: 10000000 },
            { name: "BoundlessSoul", aura: "World Destroyer", chance: 5000000 },
            { name: "StarlightRNG", aura: "Architect of Life", chance: 1000000 },
            { name: "LuckyGuy", aura: "ABSOLUTE UNIVERSE", chance: 500000 }
        ];

        function syncLeaderboard() {
            const bestAura = getBestUnlockedAura();
            let myRecord = { name: nickname, aura: bestAura.name, chance: bestAura.chance };

            let index = localLeaderboard.findIndex(item => item.name === nickname);
            if (index !== -1) {
                if (bestAura.chance > localLeaderboard[index].chance) {
                    localLeaderboard[index] = myRecord;
                }
            } else {
                localLeaderboard.push(myRecord);
            }

            localLeaderboard.sort((a, b) => b.chance - a.chance);
            localLeaderboard = localLeaderboard.slice(0, 10);

            try {
                localStorage.setItem('aura_rng_300_lb', JSON.stringify(localLeaderboard));
            } catch(e) {}
        }

        function renderLeaderboard() {
            const lbList = document.getElementById('leaderboardList');
            lbList.innerHTML = '';

            try {
                const savedLB = localStorage.getItem('aura_rng_300_lb');
                if (savedLB) localLeaderboard = JSON.parse(savedLB);
            } catch(e) {}

            syncLeaderboard();

            localLeaderboard.forEach((item, idx) => {
                const rank = idx + 1;
                const div = document.createElement('div');
                div.className = `lb-item ${rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : ''}`;
                
                div.innerHTML = `
                    <div class="lb-rank ${rank <= 3 ? 'r' + rank : ''}">#${rank}</div>
                    <div class="lb-user">${escapeHtml(item.name)}</div>
                    <div class="lb-aura">
                        <span>${escapeHtml(item.aura)}</span>
                        <span class="lb-rarity">${formatRarity(item.chance)}</span>
                    </div>
                `;
                lbList.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        /* ==========================================================================
           6. Core RNG Roll & Display Update
           ========================================================================== */
        function formatRarity(chance) {
            if (chance >= 1e8)  return `1 / ${(chance / 1e8).toFixed(1)}억`;
            if (chance >= 1e4)  return `1 / ${(chance / 1e4).toFixed(1)}만`;
            return `1 / ${chance.toLocaleString()}`;
        }

        function updateDisplay() {
            document.getElementById('lblNickname').innerText = nickname;
            document.getElementById('statTotalRolls').innerText = totalRolls.toLocaleString();
            
            const unlockedCount = AURAS.filter(a => inventory[a.id] > 0).length;
            document.getElementById('statCollectionRate').innerText = `${unlockedCount}/${AURAS.length}`;

            const bestAura = getBestUnlockedAura();
            document.getElementById('statBestRarity').innerText = formatRarity(bestAura.chance);

            const nameEl = document.getElementById('auraName');
            const rarityEl = document.getElementById('auraRarity');
            const visualEl = document.getElementById('auraVisual');
            const coreEl = document.getElementById('auraCore');

            nameEl.innerText = equipped.name;
            nameEl.style.color = equipped.color;
            nameEl.style.textShadow = `0 0 ${15 + equipped.tier * 8}px ${equipped.glow}`;

            rarityEl.innerText = formatRarity(equipped.chance);
            
            // Set dynamic tier class for visual variation
            visualEl.className = `aura-visual tier-${equipped.tier}`;
            visualEl.style.setProperty('--aura-color', equipped.color);
            visualEl.style.setProperty('--aura-glow', equipped.glow);
            visualEl.style.background = `radial-gradient(circle, ${equipped.color} 0%, rgba(0,0,0,0) 75%)`;
            visualEl.style.boxShadow = `0 0 ${40 + equipped.tier * 15}px ${equipped.glow}`;

            coreEl.style.background = equipped.color;
            coreEl.style.boxShadow = `0 0 ${20 + equipped.tier * 10}px ${equipped.glow}, 0 0 ${40 + equipped.tier * 10}px #ffffff`;

            document.getElementById('btnOpenCollection').innerText = `도감 (${unlockedCount}/${AURAS.length})`;
        }

        function roll() {
            if (isRolling) return;
            isRolling = true;

            totalRolls++;
            saveData();

            const cooldownBar = document.getElementById('cooldownBar');
            cooldownBar.style.transition = 'none';
            cooldownBar.style.width = '100%';
            setTimeout(() => {
                cooldownBar.style.transition = 'width 0.45s linear';
                cooldownBar.style.width = '0%';
            }, 10);

            let rolledAura = AURAS[AURAS.length - 1];
            for (let aura of AURAS) {
                if (Math.random() * aura.chance < 1) {
                    rolledAura = aura;
                    break;
                }
            }

            inventory[rolledAura.id] = (inventory[rolledAura.id] || 0) + 1;
            saveData();

            playSound('roll');

            if (rolledAura.cutscene && rolledAura.chance > equipped.chance) {
                triggerCutscene(rolledAura);
            } else {
                finishRoll(rolledAura);
            }
        }

        function triggerCutscene(aura) {
            playSound('jackpot');
            const overlay = document.getElementById('cutsceneOverlay');
            const text = document.getElementById('cutsceneText');
            const sub = document.getElementById('cutsceneSub');

            text.innerText = aura.name;
            text.style.color = aura.color;
            text.style.textShadow = `0 0 35px ${aura.glow}`;
            sub.innerText = formatRarity(aura.chance);

            overlay.classList.add('active');

            setTimeout(() => {
                overlay.classList.remove('active');
                finishRoll(aura);
            }, 2200);
        }

        function finishRoll(rolledAura) {
            if (rolledAura.chance > equipped.chance) {
                equipped = rolledAura;
                playSound('upgrade');
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 400);
                initParticles();
            }

            syncLeaderboard();
            updateDisplay();

            setTimeout(() => {
                isRolling = false;
                if (autoRoll) roll();
            }, 450);
        }

        /* ==========================================================================
           7. Collection Modal Rendering
           ========================================================================== */
        function renderCollection(filterText = '') {
            const list = document.getElementById('collectionList');
            list.innerHTML = '';

            const unlockedCount = AURAS.filter(a => inventory[a.id] > 0).length;
            document.getElementById('collectionTitle').innerText = `Aura Collection (${unlockedCount}/${AURAS.length})`;

            AURAS.forEach(aura => {
                if (filterText && !aura.name.toLowerCase().includes(filterText.toLowerCase())) {
                    return;
                }

                const count = inventory[aura.id] || 0;
                const isUnlocked = count > 0;

                const card = document.createElement('div');
                card.className = `collection-card ${isUnlocked ? 'unlocked' : 'locked'}`;
                
                card.innerHTML = `
                    ${isUnlocked ? `<div class="card-count">x${count}</div>` : ''}
                    <div style="width: 28px; height: 28px; ${aura.tier === 2 ? 'transform: rotate(45deg); border-radius: 4px;' : aura.tier >= 3 ? 'clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);' : 'border-radius: 50%;'} background: ${isUnlocked ? aura.color : '#4b5563'}; margin-top: 4px; box-shadow: 0 0 12px ${isUnlocked ? aura.glow : 'transparent'};"></div>
                    <div class="card-name" style="color: ${isUnlocked ? aura.color : '#9ca3af'};">${isUnlocked ? aura.name : '???'}</div>
                    <div class="card-rarity">${formatRarity(aura.chance)}</div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('searchCollection').addEventListener('input', (e) => {
            renderCollection(e.target.value);
        });

        /* ==========================================================================
           8. Control Events
           ========================================================================== */
        document.getElementById('btnRoll').addEventListener('click', roll);

        document.getElementById('btnAuto').addEventListener('click', () => {
            autoRoll = !autoRoll;
            const btn = document.getElementById('btnAuto');
            if (autoRoll) {
                btn.classList.add('active');
                btn.innerText = 'AUTO: ON';
                roll();
            } else {
                btn.classList.remove('active');
                btn.innerText = 'AUTO: OFF';
            }
        });

        document.getElementById('btnChangeNickname').addEventListener('click', () => {
            const newNick = prompt('사용할 닉네임을 입력하세요 (최대 12자):', nickname);
            if (newNick && newNick.trim().length > 0) {
                nickname = newNick.trim().substring(0, 12);
                saveData();
                updateDisplay();
                syncLeaderboard();
            }
        });

        document.getElementById('btnOpenCollection').addEventListener('click', () => {
            document.getElementById('searchCollection').value = '';
            renderCollection();
            document.getElementById('collectionModal').classList.add('open');
        });

        document.getElementById('btnCloseCollection').addEventListener('click', () => {
            document.getElementById('collectionModal').classList.remove('open');
        });

        document.getElementById('btnOpenLeaderboard').addEventListener('click', () => {
            renderLeaderboard();
            document.getElementById('leaderboardModal').classList.add('open');
        });

        document.getElementById('btnCloseLeaderboard').addEventListener('click', () => {
            document.getElementById('leaderboardModal').classList.remove('open');
        });

        updateDisplay();
    </script>
</body>
</html>
