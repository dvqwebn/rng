<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura RNG Simulator - 1500 Dynamic Auras & Cosmic Themes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #020208;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            will-change: transform;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            min-height: 100vh;
            justify-content: space-between;
        }

        /* Header Area */
        header {
            text-align: center;
            margin-top: 5px;
            width: 100%;
        }

        header h1 {
            font-size: 2.8rem;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #38bdf8, #a855f7, #ec4899, #f59e0b, #10b981, #6366f1);
            background-size: 400% 400%;
            animation: gradientShift 4s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-shadow: 0 0 45px rgba(168, 85, 247, 0.7);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .user-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .nickname-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #38bdf8;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .nickname-badge:hover {
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        .stats-bar {
            display: flex;
            gap: 14px;
            margin-top: 10px;
            background: rgba(10, 15, 30, 0.75);
            padding: 8px 20px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            font-size: 0.88rem;
            justify-content: center;
            flex-wrap: wrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .stat-item span {
            color: #fbbf24;
            font-weight: bold;
        }

        .base-luck-badge {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(217, 119, 6, 0.4));
            border: 1px solid #f59e0b;
            color: #fbbf24;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .luck-indicator {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(5, 150, 105, 0.5));
            border: 1px solid #10b981;
            color: #34d399;
            padding: 4px 14px;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 800;
            display: none;
            align-items: center;
            gap: 6px;
            animation: pulseGlow 1.2s infinite alternate;
        }

        /* Dynamic Aura Display Area */
        .aura-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            width: 100%;
            position: relative;
        }

        .aura-visual {
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.4s ease, filter 0.4s ease;
            margin-bottom: 20px;
            will-change: transform, filter;
        }

        /* Tiers Visual Rules */
        .aura-visual.tier-1 { border-radius: 50%; }
        .aura-visual.tier-1 .aura-core {
            width: 75px; height: 75px; border-radius: 50%;
            animation: pulseGlow 2.2s ease-in-out infinite alternate;
        }

        .aura-visual.tier-2 { border-radius: 22%; animation: slowRotate 12s linear infinite; }
        .aura-visual.tier-2::after {
            content: ''; position: absolute; width: 210px; height: 210px;
            border: 2px dashed var(--aura-color, #fff); border-radius: 30%;
            animation: slowRotate 8s linear infinite reverse; opacity: 0.8;
            box-shadow: 0 0 25px var(--aura-glow, #fff);
        }
        .aura-visual.tier-2 .aura-core {
            width: 85px; height: 85px; transform: rotate(45deg); border-radius: 16px;
            animation: pulseGlow 1.6s ease-in-out infinite alternate;
        }

        .aura-visual.tier-3 { border-radius: 50%; }
        .aura-visual.tier-3::before {
            content: ''; position: absolute; width: 240px; height: 240px; border-radius: 50%;
            border: 3px solid var(--aura-color, #fff);
            box-shadow: 0 0 45px var(--aura-glow, #fff), inset 0 0 45px var(--aura-glow, #fff);
            animation: ringExpand 2.2s ease-in-out infinite alternate;
        }
        .aura-visual.tier-3::after {
            content: ''; position: absolute; width: 270px; height: 270px; border-radius: 50%;
            border: 1px dotted var(--aura-glow, #fff);
            animation: slowRotate 15s linear infinite;
        }
        .aura-visual.tier-3 .aura-core {
            width: 95px; height: 95px;
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            animation: fastRotate 5s linear infinite, starPulse 1.4s ease-in-out infinite alternate;
        }

        .aura-visual.tier-4 { border-radius: 50%; }
        .aura-visual.tier-4::after {
            content: ''; position: absolute; width: 280px; height: 280px;
            border: 3px dashed var(--aura-color, #fff); border-radius: 50%;
            animation: ringRotate 4s linear infinite; box-shadow: 0 0 60px var(--aura-glow, #fff);
        }
        .aura-visual.tier-4::before {
            content: ''; position: absolute; width: 330px; height: 330px;
            border: 3px dotted var(--aura-glow, #fff); border-radius: 50%;
            animation: fastRotate 6s linear infinite reverse;
            filter: drop-shadow(0 0 35px var(--aura-color, #fff));
        }
        .aura-visual.tier-4 .aura-core {
            width: 110px; height: 110px;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: fastRotate 2.5s linear infinite;
        }

        .aura-visual.tier-5 { border-radius: 50%; animation: divineFloat 2.5s ease-in-out infinite alternate; }
        .aura-visual.tier-5::after {
            content: ''; position: absolute; width: 320px; height: 320px;
            border: 5px double var(--aura-color, #fff); border-radius: 50%;
            animation: ringRotate 2.4s linear infinite;
            box-shadow: 0 0 100px var(--aura-glow, #fff), inset 0 0 70px var(--aura-color, #fff);
        }
        .aura-visual.tier-5::before {
            content: ''; position: absolute; width: 370px; height: 370px;
            clip-path: polygon(50% 0%, 80% 10%, 100% 35%, 100% 70%, 80% 90%, 50% 100%, 20% 90%, 0% 70%, 0% 35%, 20% 10%);
            border: 3px solid var(--aura-glow, #fff); animation: slowRotate 4s linear infinite reverse;
            background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 90px var(--aura-glow, #fff);
        }
        .aura-visual.tier-5 .aura-core {
            width: 130px; height: 130px;
            clip-path: polygon(50% 0%, 63% 28%, 95% 25%, 75% 50%, 95% 75%, 63% 72%, 50% 100%, 37% 72%, 5% 75%, 25% 50%, 5% 25%, 37% 28%);
            animation: fastRotate 1.5s linear infinite, godPulse 0.7s ease-in-out infinite alternate;
        }

        .aura-core {
            background: #fff;
            box-shadow: 0 0 55px #fff;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        @keyframes slowRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes fastRotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
        @keyframes ringRotate {
            from { transform: rotate(0deg) scale(0.95); }
            50% { transform: rotate(180deg) scale(1.1); }
            to { transform: rotate(360deg) scale(0.95); }
        }
        @keyframes ringExpand { 0% { transform: scale(0.85); opacity: 0.4; } 100% { transform: scale(1.18); opacity: 0.95; } }
        @keyframes pulseGlow { 0% { transform: scale(0.9); opacity: 0.6; } 100% { transform: scale(1.2); opacity: 0.98; } }
        @keyframes starPulse { 0% { transform: scale(0.88) rotate(0deg); } 100% { transform: scale(1.3) rotate(180deg); } }
        @keyframes godPulse {
            0% { transform: scale(0.85) rotate(0deg); filter: brightness(1); }
            100% { transform: scale(1.4) rotate(360deg); filter: brightness(2); }
        }
        @keyframes divineFloat { 0% { transform: translateY(-12px); } 100% { transform: translateY(12px); } }

        .aura-info { text-align: center; z-index: 5; }
        .equipped-tag { font-size: 0.8rem; letter-spacing: 4px; text-transform: uppercase; color: #10b981; margin-bottom: 4px; font-weight: 800; }
        .aura-theme-badge { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: #38bdf8; font-weight: 700; margin-bottom: 2px; }
        .aura-name { font-size: 2.7rem; font-weight: 900; letter-spacing: 1px; margin-bottom: 6px; text-shadow: 0 0 40px rgba(0,0,0,0.95); transition: color 0.3s ease; line-height: 1.1; }
        .aura-rarity { font-size: 1.25rem; font-weight: 800; color: #f3f4f6; background: rgba(0, 0, 0, 0.8); padding: 6px 26px; border-radius: 18px; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.35); box-shadow: 0 4px 30px rgba(0,0,0,0.85); }

        /* Controls Area */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; max-width: 500px; margin-bottom: 10px; }
        .cooldown-bar-container { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; }
        .cooldown-bar { width: 0%; height: 100%; background: #3b82f6; transition: width 0.05s linear; }

        .btn-main {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white; border: none; padding: 18px 24px; font-size: 1.3rem; font-weight: 900;
            border-radius: 18px; cursor: pointer; box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45), inset 0 2px 0 rgba(255,255,255,0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease; width: 100%; text-align: center;
        }
        .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4); }

        .btn-buff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }

        .btn-buff {
            background: linear-gradient(135deg, #059669, #047857);
            color: #ecfdf5; border: 1px solid #10b981; padding: 12px 14px; font-size: 0.88rem; font-weight: 800;
            border-radius: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); width: 100%;
            display: flex; justify-content: center; align-items: center; gap: 6px; transition: all 0.2s;
            text-align: center;
        }
        .btn-buff:hover { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-buff:disabled { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); color: #6b7280; cursor: not-allowed; box-shadow: none; }

        .btn-mega {
            background: linear-gradient(135deg, #7c3aed, #6d28d9); border-color: #a855f7; box-shadow: 0 4px 18px rgba(168, 85, 247, 0.45);
        }
        .btn-mega:hover { background: linear-gradient(135deg, #9333ea, #7c3aed); }

        .btn-ultra {
            background: linear-gradient(135deg, #d97706, #b45309); border-color: #f59e0b; box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45);
        }
        .btn-ultra:hover { background: linear-gradient(135deg, #f59e0b, #d97706); }

        .btn-hyper {
            background: linear-gradient(135deg, #e11d48, #be185d); border-color: #f43f5e; box-shadow: 0 4px 22px rgba(244, 63, 94, 0.6);
            grid-column: span 2; font-size: 1.05rem; padding: 14px; text-shadow: 0 0 10px rgba(255,255,255,0.5);
            animation: hyperGlow 2s infinite alternate;
        }
        .btn-hyper:hover { background: linear-gradient(135deg, #f43f5e, #e11d48); }

        @keyframes hyperGlow {
            0% { box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
            100% { box-shadow: 0 0 30px rgba(244, 63, 94, 0.9); }
        }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 100%; }
        .btn-sub { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); color: #fff; padding: 12px 10px; font-size: 0.9rem; font-weight: 800; border-radius: 12px; cursor: pointer; text-align: center; transition: all 0.2s ease; }
        .btn-sub:hover { background: rgba(255, 255, 255, 0.18); }
        .btn-auto.active { background: linear-gradient(135deg, #059669, #047857); border-color: #10b981; box-shadow: 0 0 18px rgba(16, 185, 129, 0.6); }

        /* Modal Styles */
        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(16px); z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .modal.open { opacity: 1; pointer-events: auto; }
        .modal-content { background: #080c16; border: 1px solid rgba(255, 255, 255, 0.2); width: 95%; max-width: 920px; max-height: 85vh; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; box-shadow: 0 20px 70px rgba(0, 0, 0, 0.95); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); padding-bottom: 10px; }
        .modal-title { font-size: 1.4rem; font-weight: 900; color: #f3f4f6; }
        .close-btn { background: none; border: none; color: #9ca3af; font-size: 2rem; cursor: pointer; }
        .close-btn:hover { color: #fff; }
        .search-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 10px 14px; color: white; margin-bottom: 12px; width: 100%; font-size: 0.92rem; }
        .search-box:focus { outline: none; border-color: #3b82f6; }

        /* Collection Grid */
        .collection-list { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); gap: 10px; padding-right: 5px; }
        .collection-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 10px; text-align: center; display: flex; flex-direction: column; align-items: center; position: relative; }
        .collection-card.unlocked { background: rgba(255, 255, 255, 0.09); border-color: rgba(255, 255, 255, 0.22); }
        .collection-card.locked { opacity: 0.22; filter: grayscale(1); }
        .card-name { font-size: 0.8rem; font-weight: 800; margin-top: 6px; line-height: 1.2; }
        .card-rarity { font-size: 0.68rem; color: #9ca3af; margin-top: 3px; }
        .card-count { position: absolute; top: 5px; right: 6px; font-size: 0.65rem; background: rgba(0, 0, 0, 0.75); padding: 2px 6px; border-radius: 8px; color: #fbbf24; font-weight: bold; }

        /* Leaderboard */
        .leaderboard-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .lb-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; }
        .lb-item.top1 { background: linear-gradient(90deg, rgba(251, 191, 36, 0.18), rgba(0,0,0,0.4)); border-color: #fbbf24; }
        .lb-item.top2 { background: linear-gradient(90deg, rgba(226, 232, 240, 0.18), rgba(0,0,0,0.4)); border-color: #94a3b8; }
        .lb-item.top3 { background: linear-gradient(90deg, rgba(217, 119, 6, 0.18), rgba(0,0,0,0.4)); border-color: #d97706; }
        .lb-rank { font-weight: 900; width: 35px; font-size: 1.1rem; }
        .lb-rank.r1 { color: #fbbf24; } .lb-rank.r2 { color: #cbd5e1; } .lb-rank.r3 { color: #f59e0b; }
        .lb-user { flex-grow: 1; font-weight: 800; color: #f3f4f6; margin: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lb-aura { text-align: right; font-weight: 800; }
        .lb-rarity { font-size: 0.75rem; color: #9ca3af; display: block; }

        /* Cutscene Overlay */
        #cutsceneOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 200; display: flex; flex-direction: column;
            justify-content: center; align-items: center; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
            overflow: hidden;
        }
        #cutsceneOverlay.active { opacity: 1; pointer-events: auto; }
        .cutscene-flash {
            position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none;
            z-index: 20;
        }
        .speed-lines {
            position: absolute; inset: 0;
            background: repeating-radial-gradient(circle at center, transparent 0, transparent 10px, rgba(255,255,255,0.08) 11px, transparent 13px);
            animation: speedZoom 0.25s linear infinite; opacity: 0.8;
        }
        @keyframes speedZoom {
            0% { transform: scale(0.8); opacity: 0.3; }
            100% { transform: scale(1.6); opacity: 0.9; }
        }
        .cutscene-text {
            font-size: 4rem; font-weight: 900; text-align: center; letter-spacing: 8px;
            animation: extremeZoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; padding: 0 20px; z-index: 10;
            line-height: 1.1;
        }
        .cutscene-sub {
            font-size: 1.8rem; margin-top: 15px; color: #fbbf24; opacity: 0;
            animation: fadeIn 0.4s ease 0.6s forwards; font-weight: 800; z-index: 10;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
        }

        .glitch-beam {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, var(--aura-color, #fff) 15%, transparent 75%);
            opacity: 0.3; animation: beamPulse 0.12s infinite alternate;
        }

        @keyframes beamPulse {
            0% { transform: scale(0.9); opacity: 0.2; }
            100% { transform: scale(1.25); opacity: 0.55; }
        }

        @keyframes extremeZoomIn {
            0% { transform: scale(0.01) rotate(-20deg); opacity: 0; filter: blur(25px); }
            50% { transform: scale(1.25) rotate(6deg); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes fadeIn { to { opacity: 1; } }

        /* Shake Animations */
        .shake-light { animation: shakeLight 0.3s ease-in-out; }
        .shake-heavy { animation: shakeHeavy 0.6s ease-in-out; }
        .shake-godly { animation: shakeGodly 1.2s ease-in-out infinite alternate; }

        @keyframes shakeLight {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-8px, 6px); }
            75% { transform: translate(8px, -6px); }
        }
        @keyframes shakeHeavy {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-22px, 15px) rotate(-2deg); }
            30% { transform: translate(22px, -15px) rotate(2deg); }
            50% { transform: translate(-15px, 10px) rotate(-1deg); }
            70% { transform: translate(15px, -10px) rotate(1deg); }
        }
        @keyframes shakeGodly {
            0% { transform: translate(-10px, -10px) scale(1); filter: hue-rotate(0deg); }
            20% { transform: translate(15px, 12px) scale(1.02); filter: hue-rotate(90deg); }
            40% { transform: translate(-18px, 15px) scale(0.98); filter: hue-rotate(180deg); }
            60% { transform: translate(12px, -18px) scale(1.03); filter: hue-rotate(270deg); }
            80% { transform: translate(-15px, 10px) scale(0.99); filter: hue-rotate(360deg); }
            100% { transform: translate(10px, -10px) scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <header>
            <h1>AURA RNG</h1>
            <div class="user-bar">
                <div class="nickname-badge" id="btnChangeNickname">👤 Player: <span id="lblNickname">Player123</span></div>
            </div>
            <div class="stats-bar">
                <div class="stat-item">기본 행운: <span class="base-luck-badge">✨ 5x LUCK ACTIVE</span></div>
                <div class="stat-item">총 뽑기: <span id="statTotalRolls">0</span>회</div>
                <div class="stat-item">수집률: <span id="statCollectionRate">0/1500</span></div>
                <div class="stat-item">최고 기록: <span id="statBestRarity">1/2</span></div>
                <div class="luck-indicator" id="luckIndicator">🍀 추가 행운 <span id="lblLuckMultiplier">1</span>배 적용 중 (<span id="lblLuckTimer">30</span>s)</div>
            </div>
        </header>

        <div class="aura-display">
            <div class="aura-visual tier-1" id="auraVisual">
                <div class="aura-core" id="auraCore"></div>
            </div>
            <div class="aura-info">
                <div class="equipped-tag">EQUIPPED AURA</div>
                <div class="aura-theme-badge" id="auraThemeBadge">🌌 COSMIC THEME</div>
                <div class="aura-name" id="auraName">Common</div>
                <div class="aura-rarity" id="auraRarity">1 / 2</div>
            </div>
        </div>

        <div class="controls">
            <div class="cooldown-bar-container">
                <div class="cooldown-bar" id="cooldownBar"></div>
            </div>
            
            <button class="btn-main" id="btnRoll">ROLL (0.5s)</button>
            
            <div class="btn-buff-grid">

            </div>
            <button class="btn-buff" id="btnLuckBuff">🍀 행운 버프 스킬 사용 (2분 쿨타임)</button>
            
            <div class="btn-group">
                <button class="btn-sub btn-auto" id="btnAuto">AUTO: OFF</button>
                <button class="btn-sub" id="btnOpenCollection">도감 (0/1500)</button>
                <button class="btn-sub" id="btnOpenLeaderboard" style="border-color: #f59e0b; color: #fbbf24;">🏆 랭킹 (TOP 10)</button>

    <!-- Collection Modal -->
    <div class="modal" id="collectionModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="collectionTitle">Aura Collection (1500 MAX)</div>

                <div class="modal-title">🏆 Global Leaderboard (TOP 10)</div>
                <button class="close-btn" id="btnCloseLeaderboard">&times;</button>

    <!-- Cutscene Overlay -->
    <div id="cutsceneOverlay">
        <div class="speed-lines"></div>
        <div class="glitch-beam" id="glitchBeam"></div>
        <div class="cutscene-flash" id="cutsceneFlash"></div>
        <div class="cutscene-text" id="cutsceneText">STARLIGHT</div>
        <div class="cutscene-sub" id="cutsceneSub">1 / 1,000,000</div>
    </div>

    <script>
        /* ==========================================================================
           1. 1,500 Unique Aura Database Generator
           ========================================================================== */
        const baseWords = [
            'Common', 'Uncommon', 'Good', 'Natural', 'Rare', 'Divinus', 'Lucky Seven', 'Crystalline', 'Gilded', 'Topaz',
            'Ruby', 'Jackpot', 'Sapphire', 'Comet', 'Poison', 'Blaze', 'Electric', 'Jade', 'Frostbite', 'Windstorm',
            'Diaboli', 'Magnetic', 'Aquamarine', 'Emerald', 'Bleeding', 'Solar', 'Flameshine', 'Lunar', 'Corrosive', 'Shadow',
            'Pulse', 'Necromancer', 'Clockwork', 'Glitch', 'Void Walker', 'Biohazard', 'Supernova', 'Starlight', 'Boundless', 'Celestial',
            'Prismatic', 'Infernal Core', 'Neptune', 'Astral', 'Kyawthuite', 'Titanium', 'Hyperion', 'Galaxy', 'Eclipse', 'Valkyrie',
            'Chronos', 'Twilight', 'Borealis', 'Hades', 'Poseidon', 'Zeus', 'Hyper-Volt', 'Singularity', 'Matrix', 'Aether Code',
            'Chromatic', 'Andromeda', 'Abyssal Hunter', 'Archangel', 'Bloodlust', 'Sovereign', 'Solaris Monarch', 'Gargantua', 'Apostle', 'Ethereal',
            'Genesis Engine', 'Valhalla Domain', 'Apocalypse', 'Ragnarok', 'OBLIVION', 'Eternal Fate', 'Infinity', 'Nebula Overlord', 'Cosmic Origin', 'Dark Matter',
            'Omnipotent', 'Transcendent', 'Alpha & Omega', 'Chrono Sovereign', 'Abyssal Monarch', 'Starlight Empress', 'Architect of Life', 'World Destroyer', 'Nirvana Realized', 'Aetherius Supreme',
            'Quantum Multiverse', 'Void Emperor', 'SOL PRIME', 'AURA DEITY', 'ABSOLUTE UNIVERSE'
        ];

        const prefixes = ['Lesser', 'Pure', 'Ancient', 'Radiant', 'Starlight', 'Phantom', 'Cosmic', 'Mythic', 'Divine', 'Ultimate', 'Supreme', 'Absolute', 'Infinite', 'Ethereal', 'Hyper', 'Celestial', 'Abyssal', 'Chrono', 'Astral', 'Nirvana', 'Prismatic', 'Titan', 'Immortal', 'Omni', 'Singular', 'Vanguard', 'Paradox', 'Vortex', 'Apex', 'Transcendent', 'Deep Ocean', 'Forest Spirit', 'Volcanic', 'Solar Wind', 'Galactic', 'Storm Lord', 'Abyssal Deep', 'Nebula', 'Gaia', 'Tidal Wave'];
        const suffixes = ['I', 'II', 'III', 'IV', 'V', 'Prime', 'Unbound', 'Awakened', 'Overdrive', 'Zero', 'EX', 'Omega', 'Alpha', 'Nova', 'Sovereign', 'Unchained', 'Eternity', 'Zenith', 'Ascended', 'Infinity', 'Unfathomed', 'Dominion', 'Genesis', 'Origin', 'Realm', 'Oceanus', 'Cosmos', 'Terra', 'Aether', 'Abyss'];

        const colorPalette = [
            { main: '#a1a1aa', glow: '#d4d4d8' }, { main: '#4ade80', glow: '#22c55e' },
            { main: '#60a5fa', glow: '#3b82f6' }, { main: '#facc15', glow: '#eab308' },
            { main: '#38bdf8', glow: '#0284c7' }, { main: '#a855f7', glow: '#9333ea' },
            { main: '#34d399', glow: '#059669' }, { main: '#e0f2fe', glow: '#38bdf8' },
            { main: '#f59e0b', glow: '#d97706' }, { main: '#fb923c', glow: '#ea580c' },
            { main: '#f43f5e', glow: '#e11d48' }, { main: '#2563eb', glow: '#1d4ed8' },
            { main: '#818cf8', glow: '#4f46e5' }, { main: '#84cc16', glow: '#65a30d' },
            { main: '#ff6600', glow: '#cc5200' }, { main: '#fef08a', glow: '#eab308' },
            { main: '#10b981', glow: '#047857' }, { main: '#a5f3fc', glow: '#0891b2' },
            { main: '#ef4444', glow: '#b91c1c' }, { main: '#ec4899', glow: '#be185d' }
        ];

        function generate1500UniqueAuras() {
            const list = [];
            const nameSet = new Set();
            const TOTAL = 1500;
            const minLog = Math.log(2);
            const maxLog = Math.log(100000000);

            for (let i = 0; i < TOTAL; i++) {
                let chance;
                if (i === 0) chance = 2;
                else if (i === TOTAL - 1) chance = 100000000;
                else {
                    const ratio = i / (TOTAL - 1);
                    chance = Math.round(Math.exp(minLog + ratio * (maxLog - minLog)));
                }

                let name = '';
                if (i < baseWords.length) {
                    name = baseWords[i];
                } else {
                    let attempt = 0;
                    do {
                        const p = prefixes[(i + attempt) % prefixes.length];
                        const b = baseWords[(i + Math.floor(attempt / 2)) % baseWords.length];
                        const s = suffixes[(i + attempt) % suffixes.length];
                        name = `${p} ${b} ${s}`;
                        attempt++;
                    } while (nameSet.has(name));
                }
                nameSet.add(name);

                const colorObj = colorPalette[i % colorPalette.length];
                let tier = 1;
                if (chance >= 20000000) tier = 5;
                else if (chance >= 1000000) tier = 4;
                else if (chance >= 50000) tier = 3;
                else if (chance >= 500) tier = 2;

                let theme = 'nature';
                if (chance >= 50000000) theme = 'godly';
                else if (chance >= 10000000) theme = 'abyss';
                else if (chance >= 1000000) theme = 'cosmic';
                else if (chance >= 100000) theme = 'volcano';
                else if (chance >= 5000) theme = 'ocean';

                list.push({
                    id: `aura_${i + 1}`,
                    name: name,
                    chance: chance,
                    color: colorObj.main,
                    glow: colorObj.glow,
                    particles: Math.min(25 + tier * 16, 120), 
                    particleSpeed: 0.8 + tier * 0.9,
                    particleSizeMax: 2.5 + tier * 2.2,
                    tier: tier,
                    theme: theme,
                    cutscene: chance >= 20000
                });
            }
            return list;
        }

        const RAW_AURAS = generate1500UniqueAuras();
        const AURAS = RAW_AURAS.sort((a, b) => b.chance - a.chance);

        /* ==========================================================================
           2. State & Storage Management
           ========================================================================== */
        let nickname = localStorage.getItem('aura_rng_1500_nick') || 'Player' + Math.floor(1000 + Math.random() * 9000);
        let totalRolls = parseInt(localStorage.getItem('aura_rng_1500_rolls') || '0');
        let inventory = JSON.parse(localStorage.getItem('aura_rng_1500_inv') || '{}');

        let autoRoll = false;
        let isRolling = false;

        const BASE_LUCK_MULT = 5; // 기본 행운 5배 적용
        let luckMultiplier = 1;
        let luckTimeLeft = 0;
        let luckCooldownLeft = parseInt(localStorage.getItem('aura_rng_1500_luck_cd') || '0');
        const BUFF_DURATION_TOTAL = 30;
        const BUFF_COOLDOWN_TOTAL = 120;

        let megaLuckCooldownLeft = parseInt(localStorage.getItem('aura_rng_1500_mega_cd') || '0');
        const MEGA_LUCK_COOLDOWN_TOTAL = 60;

        let ultraLuckCooldownLeft = parseInt(localStorage.getItem('aura_rng_1500_ultra_cd') || '0');
        const ULTRA_LUCK_COOLDOWN_TOTAL = 180;

        let hyperLuckCooldownLeft = parseInt(localStorage.getItem('aura_rng_1500_hyper_cd') || '0');
        const HYPER_LUCK_COOLDOWN_TOTAL = 300;

        AURAS.forEach(a => { if (!inventory[a.id]) inventory[a.id] = 0; });

        function getBestUnlockedAura() {
            for (let a of AURAS) {
                if (inventory[a.id] > 0) return a;
            }
            return AURAS[AURAS.length - 1];
        }

        let equipped = getBestUnlockedAura();
        if (inventory[equipped.id] === 0) inventory[equipped.id] = 1;

        function saveData() {
            localStorage.setItem('aura_rng_1500_nick', nickname);
            localStorage.setItem('aura_rng_1500_rolls', totalRolls.toString());
            localStorage.setItem('aura_rng_1500_inv', JSON.stringify(inventory));
            localStorage.setItem('aura_rng_1500_luck_cd', luckCooldownLeft.toString());
            localStorage.setItem('aura_rng_1500_mega_cd', megaLuckCooldownLeft.toString());
            localStorage.setItem('aura_rng_1500_ultra_cd', ultraLuckCooldownLeft.toString());
            localStorage.setItem('aura_rng_1500_hyper_cd', hyperLuckCooldownLeft.toString());
        }

        /* ==========================================================================
           3. Web Audio System
           ========================================================================== */
        let audioCtx = null;
        function playSound(type, tier = 1) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;

                if (type === 'roll') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08);
                } else if (type === 'upgrade' || type === 'buff') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(450, now);
                    osc.frequency.exponentialRampToValueAtTime(950, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now); osc.stop(now + 0.25);
                } else if (type === 'jackpot') {
                    const duration = tier >= 5 ? 1.8 : tier >= 4 ? 1.2 : 0.8;
                    const freqScale = 220 + tier * 150;

                    for (let i = 0; i < 2; i++) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.connect(gain); gain.connect(audioCtx.destination);

                        osc.type = i === 0 ? 'sawtooth' : 'triangle';
                        const startFreq = freqScale * (1 + i * 0.2);
                        osc.frequency.setValueAtTime(startFreq, now);
                        osc.frequency.exponentialRampToValueAtTime(startFreq * 2.5, now + duration);

                        gain.gain.setValueAtTime(0.12, now);
                        gain.gain.linearRampToValueAtTime(0.01, now + duration);

                        osc.start(now); osc.stop(now + duration);
                    }
                }
            } catch(e) {}
        }

        /* ==========================================================================
           4. Enhanced Canvas Cosmic Background System
           ========================================================================== */
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let particles = [];
        let stars = [];
        let viewWidth = 0;
        let viewHeight = 0;
        let bgAngle = 0;

        function resizeCanvas() {
            viewWidth = window.innerWidth;
            viewHeight = window.innerHeight;
            canvas.width = viewWidth;
            canvas.height = viewHeight;
            initBackgroundStars();
        }
        window.addEventListener('resize', resizeCanvas);

        function initBackgroundStars() {
            stars = [];
            const count = Math.min(Math.floor((viewWidth * viewHeight) / 3000), 250);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * viewWidth,
                    y: Math.random() * viewHeight,
                    size: Math.random() * 1.8 + 0.4,
                    alpha: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: 0.01 + Math.random() * 0.03
                });
            }
        }
        resizeCanvas();

        class DynamicParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * viewWidth;
                this.y = Math.random() * viewHeight;
                const maxS = equipped.particleSizeMax || 4.0;
                this.size = Math.random() * maxS + 1.2;
                const spd = equipped.particleSpeed || 1.2;

                if (equipped.theme === 'ocean') {
                    this.speedX = (Math.random() - 0.5) * spd * 1.8;
                    this.speedY = -Math.random() * spd * 2.2;
                } else if (equipped.theme === 'volcano') {
                    this.speedX = (Math.random() - 0.5) * spd * 3.0;
                    this.speedY = -Math.random() * spd * 4.0;
                } else if (equipped.theme === 'nature') {
                    this.speedX = Math.sin(Math.random() * Math.PI) * spd * 1.5;
                    this.speedY = Math.random() * spd * 1.8;
                } else if (equipped.theme === 'abyss') {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * (viewWidth / 2);
                    this.x = viewWidth / 2 + Math.cos(angle) * dist;
                    this.y = viewHeight / 2 + Math.sin(angle) * dist;
                    this.speedX = (Math.random() - 0.5) * spd * 2.2;
                    this.speedY = (Math.random() - 0.5) * spd * 2.2;
                } else {
                    this.speedX = (Math.random() - 0.5) * spd * (equipped.tier >= 4 ? 3.5 : 1.8);
                    this.speedY = -Math.random() * spd * 2.5;
                }

                this.alpha = Math.random() * 0.85 + 0.25;
            }
            update() {
                if (equipped.theme === 'abyss') {
                    const dx = viewWidth / 2 - this.x;
                    const dy = viewHeight / 2 - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 15) this.reset();
                    this.x += (dx / dist) * 2.2 + (Math.random() - 0.5);
                    this.y += (dy / dist) * 2.2 + (Math.random() - 0.5);
                } else {
                    this.x += this.speedX; this.y += this.speedY;
                    if (this.x < 0 || this.x > viewWidth || this.y < 0 || this.y > viewHeight) {
                        this.reset();
                        if (equipped.theme === 'ocean' || equipped.theme === 'volcano') this.y = viewHeight;
                    }
                }
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = equipped.color;
                ctx.shadowBlur = equipped.tier * 8;
                ctx.shadowColor = equipped.glow;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(equipped.particles || 60, 180);
            for (let i = 0; i < count; i++) particles.push(new DynamicParticle());
        }

        function drawThemeBackground() {
            bgAngle += 0.002;
            const cx = viewWidth / 2 + Math.cos(bgAngle) * 30;
            const cy = viewHeight / 2 + Math.sin(bgAngle) * 30;
            let bgGrad = ctx.createRadialGradient(cx, cy, 30, viewWidth/2, viewHeight/2, Math.max(viewWidth, viewHeight) * 0.95);

            if (equipped.theme === 'nature') {
                bgGrad.addColorStop(0, '#0d4a2b'); bgGrad.addColorStop(0.5, '#041d10'); bgGrad.addColorStop(1, '#010804');
            } else if (equipped.theme === 'ocean') {
                bgGrad.addColorStop(0, '#035388'); bgGrad.addColorStop(0.5, '#02213a'); bgGrad.addColorStop(1, '#010c17');
            } else if (equipped.theme === 'volcano') {
                bgGrad.addColorStop(0, '#7c1d0c'); bgGrad.addColorStop(0.5, '#2e0802'); bgGrad.addColorStop(1, '#0c0200');
            } else if (equipped.theme === 'abyss') {
                bgGrad.addColorStop(0, '#3b0b5e'); bgGrad.addColorStop(0.4, '#180230'); bgGrad.addColorStop(1, '#03000a');
            } else if (equipped.theme === 'godly') {
                bgGrad.addColorStop(0, '#825a0c'); bgGrad.addColorStop(0.5, '#332103'); bgGrad.addColorStop(1, '#050300');
            } else {
                bgGrad.addColorStop(0, '#241454'); bgGrad.addColorStop(0.5, '#0e0626'); bgGrad.addColorStop(1, '#03010c');
            }

            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, viewWidth, viewHeight);

            // 성운 별빛 레이어 (Twinkling Stars)
            for (let i = 0; i < stars.length; i++) {
                const s = stars[i];
                s.alpha += Math.sin(Date.now() * s.twinkleSpeed) * 0.015;
                const currentAlpha = Math.max(0.1, Math.min(0.9, s.alpha));
                ctx.globalAlpha = currentAlpha;
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 고희귀도 회전 오라 링 연출 (Theme Aura Ring)
            if (equipped.tier >= 3) {
                ctx.save();
                ctx.translate(viewWidth/2, viewHeight/2);
                ctx.rotate(bgAngle * 1.5);
                ctx.strokeStyle = equipped.glow;
                ctx.lineWidth = 1.5;
                ctx.globalAlpha = 0.18;
                ctx.beginPath();
                ctx.arc(0, 0, 160 + equipped.tier * 25, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        function animateParticles() {
            drawThemeBackground();
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        requestAnimationFrame(animateParticles);

        /* ==========================================================================
           5. Leaderboard Syncing
           ========================================================================== */
        let localLeaderboard = [
            { name: "AuraGod", aura: "ABSOLUTE MULTIVERSE OMNIPOTENCE", chance: 100000000 },
            { name: "SolMaster", aura: "AURA DEITY Prime", chance: 85000000 },
            { name: "VoidKing", aura: "SOL PRIME Zenith", chance: 70000000 },
            { name: "SovereignKing", aura: "Void Emperor Unbound", chance: 50000000 },
            { name: "AbyssalHunter", aura: "Quantum Multiverse Infinity", chance: 35000000 }
        ];

        function syncLeaderboard() {
            const bestAura = getBestUnlockedAura();
            let myRecord = { name: nickname, aura: bestAura.name, chance: bestAura.chance };
            let index = localLeaderboard.findIndex(item => item.name === nickname);
            if (index !== -1) {
                if (bestAura.chance > localLeaderboard[index].chance) localLeaderboard[index] = myRecord;
            } else localLeaderboard.push(myRecord);

            localLeaderboard.sort((a, b) => b.chance - a.chance);
            localLeaderboard = localLeaderboard.slice(0, 10);
            try { localStorage.setItem('aura_rng_1500_lb', JSON.stringify(localLeaderboard)); } catch(e) {}
        }

        function renderLeaderboard() {
            const lbList = document.getElementById('leaderboardList');
            lbList.innerHTML = '';
            try {
                const savedLB = localStorage.getItem('aura_rng_1500_lb');
                if (savedLB) localLeaderboard = JSON.parse(savedLB);
            } catch(e) {}
            syncLeaderboard();

            localLeaderboard.forEach((item, idx) => {
                const rank = idx + 1;
                const div = document.createElement('div');
                div.className = `lb-item ${rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : ''}`;
                div.innerHTML = `
                    <div class="lb-rank ${rank <= 3 ? 'r' + rank : ''}">#${rank}</div>
                    <div class="lb-user">${escapeHtml(item.name)}</div>
                    <div class="lb-aura">
                        <span>${escapeHtml(item.aura)}</span>
                        <span class="lb-rarity">${formatRarity(item.chance)}</span>
                    </div>
                `;
                lbList.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        /* ==========================================================================
           6. Luck Buff System & Timer Loop
           ========================================================================== */
        function triggerLuckBuff() {
            if (luckCooldownLeft > 0) return;

            const rand = Math.random() * 100;
            let resultMult = 1;
            let msg = '';

            if (rand < 50) {
                resultMult = 1;
                msg = '1배 (추가 버프 없음 / 기본 5배 유지)';
            } else if (rand < 80) {
                resultMult = 2;
                msg = '🎉 2배 추가 행운 당첨! (총 10배)';
            } else if (rand < 90) {
                resultMult = 3;
                msg = '🔥 3배 극대 추가 행운 당첨! (총 15배)';
            } else {
                resultMult = 1.5;
                msg = '✨ 1.5배 소소한 추가 행운 당첨!';
            }

            luckMultiplier = resultMult;
            luckTimeLeft = BUFF_DURATION_TOTAL;
            luckCooldownLeft = BUFF_COOLDOWN_TOTAL;
            saveData();

            playSound('buff');
            alert(`[행운 버프 결과]\n${msg}\n30초 동안 추가 행운 ${luckMultiplier}배가 기본 5배와 중첩 적용됩니다!`);
            updateDisplay();
        }

        function triggerMegaLuck() {
            if (megaLuckCooldownLeft > 0 || isRolling) return;

            megaLuckCooldownLeft = MEGA_LUCK_COOLDOWN_TOTAL;
            saveData();
            playSound('jackpot', 5);

            roll(5000);
        }

        function triggerUltraLuck() {
            if (ultraLuckCooldownLeft > 0 || isRolling) return;

            ultraLuckCooldownLeft = ULTRA_LUCK_COOLDOWN_TOTAL;
            saveData();
            playSound('jackpot', 5);

            roll(10000);
        }

        function triggerHyperLuck() {
            if (hyperLuckCooldownLeft > 0 || isRolling) return;

            hyperLuckCooldownLeft = HYPER_LUCK_COOLDOWN_TOTAL;
            saveData();
            playSound('jackpot', 5);

            roll(500000);
        }

        setInterval(() => {
            let changed = false;

            if (luckTimeLeft > 0) {
                luckTimeLeft--;
                if (luckTimeLeft === 0) luckMultiplier = 1;
                changed = true;
            }

            if (luckCooldownLeft > 0) {
                luckCooldownLeft--;
                changed = true;
            }

            if (megaLuckCooldownLeft > 0) {
                megaLuckCooldownLeft--;
                changed = true;
            }

            if (ultraLuckCooldownLeft > 0) {
                ultraLuckCooldownLeft--;
                changed = true;
            }

            if (hyperLuckCooldownLeft > 0) {
                hyperLuckCooldownLeft--;
                changed = true;
            }

            if (changed) {
                saveData();
                updateDisplay();
            }
        }, 1000);

        /* ==========================================================================
           7. Core RNG Roll & Display Update
           ========================================================================== */
        function formatRarity(chance) {
            if (chance >= 1e8) return `1 / ${(chance / 1e8).toFixed(1)}억`;
            if (chance >= 1e4) return `1 / ${(chance / 1e4).toFixed(1)}만`;
            return `1 / ${chance.toLocaleString()}`;
        }

        function getThemeName(theme) {
            switch(theme) {
                case 'nature': return '🌿 NATURE THEME';
                case 'ocean': return '🌊 OCEAN THEME';
                case 'volcano': return '🌋 VOLCANO THEME';
                case 'cosmic': return '🌌 COSMIC THEME';
                case 'abyss': return '🔮 ABYSS THEME';
                case 'godly': return '👑 GODLY THEME';
                default: return '🌌 COSMIC THEME';
            }
        }

        function updateDisplay() {
            document.getElementById('lblNickname').innerText = nickname;
            document.getElementById('statTotalRolls').innerText = totalRolls.toLocaleString();

            const unlockedCount = AURAS.filter(a => inventory[a.id] > 0).length;
            document.getElementById('statCollectionRate').innerText = `${unlockedCount}/1500`;

            const bestAura = getBestUnlockedAura();
            document.getElementById('statBestRarity').innerText = formatRarity(bestAura.chance);

            const luckInd = document.getElementById('luckIndicator');
            if (luckMultiplier > 1 && luckTimeLeft > 0) {
                luckInd.style.display = 'flex';
                document.getElementById('lblLuckMultiplier').innerText = luckMultiplier;
                document.getElementById('lblLuckTimer').innerText = luckTimeLeft;
            } else {
                luckInd.style.display = 'none';
            }

            const buffBtn = document.getElementById('btnLuckBuff');
            if (luckCooldownLeft > 0) {
                buffBtn.disabled = true;
                const mins = Math.floor(luckCooldownLeft / 60);
                const secs = luckCooldownLeft % 60;
                buffBtn.innerText = `🍀 행운 버프 쿨타임 중 (${mins > 0 ? mins + '분 ' : ''}${secs}초)`;
            } else {
                buffBtn.disabled = false;
                buffBtn.innerText = `🍀 행운 버프 스킬 사용 (2분 쿨타임)`;
            }

            const megaBtn = document.getElementById('btnMegaLuck');
            if (megaLuckCooldownLeft > 0) {
                megaBtn.disabled = true;
                const mins = Math.floor(megaLuckCooldownLeft / 60);
                const secs = megaLuckCooldownLeft % 60;
                megaBtn.innerText = `⚡ 5000배 (${mins > 0 ? mins + '분 ' : ''}${secs}초)`;
            } else {
                megaBtn.disabled = false;
                megaBtn.innerText = `⚡ 5000배 행운 (1분 쿨)`;
            }

            const ultraBtn = document.getElementById('btnUltraLuck');
            if (ultraLuckCooldownLeft > 0) {
                ultraBtn.disabled = true;
                const mins = Math.floor(ultraLuckCooldownLeft / 60);
                const secs = ultraLuckCooldownLeft % 60;
                ultraBtn.innerText = `🌟 10000배 (${mins > 0 ? mins + '분 ' : ''}${secs}초)`;
            } else {
                ultraBtn.disabled = false;
                ultraBtn.innerText = `🌟 10000배 행운 (3분 쿨)`;
            }

            const hyperBtn = document.getElementById('btnHyperLuck');
            if (hyperLuckCooldownLeft > 0) {
                hyperBtn.disabled = true;
                const mins = Math.floor(hyperLuckCooldownLeft / 60);
                const secs = hyperLuckCooldownLeft % 60;
                hyperBtn.innerText = `💥 500,000배 (${mins > 0 ? mins + '분 ' : ''}${secs}초)`;
            } else {
                hyperBtn.disabled = false;
                hyperBtn.innerText = `💥 500,000배 절대행운 (5분 쿨)`;
            }

            const nameEl = document.getElementById('auraName');
            const rarityEl = document.getElementById('auraRarity');
            const visualEl = document.getElementById('auraVisual');
            const coreEl = document.getElementById('auraCore');
            const themeBadge = document.getElementById('auraThemeBadge');

            themeBadge.innerText = getThemeName(equipped.theme);

            nameEl.innerText = equipped.name;
            nameEl.style.color = equipped.color;
            nameEl.style.textShadow = `0 0 ${20 + equipped.tier * 10}px ${equipped.glow}`;

            rarityEl.innerText = formatRarity(equipped.chance);

            visualEl.className = `aura-visual tier-${equipped.tier}`;
            visualEl.style.setProperty('--aura-color', equipped.color);
            visualEl.style.setProperty('--aura-glow', equipped.glow);
            visualEl.style.background = `radial-gradient(circle, ${equipped.color} 0%, rgba(0,0,0,0) 75%)`;
            visualEl.style.boxShadow = `0 0 ${40 + equipped.tier * 15}px ${equipped.glow}`;

            coreEl.style.background = equipped.color;
            coreEl.style.boxShadow = `0 0 ${25 + equipped.tier * 10}px ${equipped.glow}, 0 0 ${40 + equipped.tier * 10}px #ffffff`;

            document.getElementById('btnOpenCollection').innerText = `도감 (${unlockedCount}/1500)`;
        }

        function roll(customLuckMultiplier) {
            if (isRolling) return;
            isRolling = true;

            totalRolls++;
            saveData();

            const cooldownBar = document.getElementById('cooldownBar');
            cooldownBar.style.transition = 'none';
            cooldownBar.style.width = '100%';
            setTimeout(() => {
                cooldownBar.style.transition = 'width 0.45s linear';
                cooldownBar.style.width = '0%';
            }, 10);

            // BASE_LUCK_MULT(5배) 기본 보장
            const currentMultiplier = (customLuckMultiplier || luckMultiplier) * BASE_LUCK_MULT;

            let rolledAura = AURAS[AURAS.length - 1];
            for (let aura of AURAS) {
                const effectiveChance = Math.max(1, aura.chance / currentMultiplier);
                if (Math.random() * effectiveChance < 1) {
                    rolledAura = aura;
                    break;
                }
            }

            inventory[rolledAura.id] = (inventory[rolledAura.id] || 0) + 1;
            saveData();

            playSound('roll');

            if (rolledAura.cutscene && rolledAura.chance > equipped.chance) {
                triggerCutscene(rolledAura);
            } else {
                finishRoll(rolledAura);
            }
        }

        function triggerCutscene(aura) {
            playSound('jackpot', aura.tier);
            const overlay = document.getElementById('cutsceneOverlay');
            const text = document.getElementById('cutsceneText');
            const sub = document.getElementById('cutsceneSub');
            const flash = document.getElementById('cutsceneFlash');
            const beam = document.getElementById('glitchBeam');

            beam.style.setProperty('--aura-color', aura.color);

            text.innerText = aura.name;
            text.style.color = aura.color;
            text.style.textShadow = `0 0 50px ${aura.glow}, 0 0 100px #fff`;
            sub.innerText = `${getThemeName(aura.theme)} - ${formatRarity(aura.chance)}`;

            overlay.classList.add('active');

            let duration = 2200;
            if (aura.tier >= 5) {
                duration = 3400;
                flash.style.transition = 'opacity 0.15s ease-out';
                flash.style.opacity = '1';
                setTimeout(() => flash.style.opacity = '0', 250);
                document.body.classList.add('shake-godly');
            } else if (aura.tier >= 4) {
                duration = 2800;
                document.body.classList.add('shake-heavy');
            } else {
                document.body.classList.add('shake-light');
            }

            setTimeout(() => {
                document.body.classList.remove('shake-godly');
                document.body.classList.remove('shake-heavy');
                document.body.classList.remove('shake-light');
                overlay.classList.remove('active');
                finishRoll(aura);
            }, duration);
        }

        function finishRoll(aura) {
            if (aura.chance > equipped.chance) {
                equipped = aura;
                playSound('upgrade', aura.tier);
                document.body.classList.add(aura.tier >= 4 ? 'shake-heavy' : 'shake-light');
                setTimeout(() => {
                    document.body.classList.remove('shake-heavy');
                    document.body.classList.remove('shake-light');
                }, 500);
                initParticles();
            }

            updateDisplay();
            syncLeaderboard();

            setTimeout(() => {
                isRolling = false;
                if (autoRoll) {
                    roll();
                }
            }, 450);
        }

        /* ==========================================================================
           8. Collection Render & Filter
           ========================================================================== */
        function renderCollection() {
            const list = document.getElementById('collectionList');
            const query = (document.getElementById('searchCollection').value || '').toLowerCase();
            list.innerHTML = '';

            const sortedAuras = [...AURAS].reverse();

            sortedAuras.forEach(aura => {
                if (query && !aura.name.toLowerCase().includes(query)) return;

                const count = inventory[aura.id] || 0;
                const isUnlocked = count > 0;

                const card = document.createElement('div');
                card.className = `collection-card ${isUnlocked ? 'unlocked' : 'locked'}`;

                card.innerHTML = `
                    ${isUnlocked ? `<div class="card-count">x${count}</div>` : ''}
                    <div style="width: 32px; height: 32px; border-radius: 50%; background: ${isUnlocked ? aura.color : '#4b5563'}; margin-top: 5px; box-shadow: 0 0 12px ${isUnlocked ? aura.glow : 'transparent'};"></div>
                    <div class="card-name" style="color: ${isUnlocked ? aura.color : '#9ca3af'};">${isUnlocked ? aura.name : '???'}</div>
                    <div class="card-rarity">${formatRarity(aura.chance)}</div>
                `;
                list.appendChild(card);
            });
        }

        document.getElementById('searchCollection').addEventListener('input', renderCollection);

        /* ==========================================================================
           9. Control Events
           ========================================================================== */
        document.getElementById('btnRoll').addEventListener('click', () => roll());
        document.getElementById('btnLuckBuff').addEventListener('click', triggerLuckBuff);
        document.getElementById('btnMegaLuck').addEventListener('click', triggerMegaLuck);
        document.getElementById('btnUltraLuck').addEventListener('click', triggerUltraLuck);
        document.getElementById('btnHyperLuck').addEventListener('click', triggerHyperLuck);

        document.getElementById('btnAuto').addEventListener('click', () => {
            autoRoll = !autoRoll;
            const btn = document.getElementById('btnAuto');
            if (autoRoll) {
                btn.classList.add('active');
                btn.innerText = 'AUTO: ON';
                roll();
            } else {
                btn.classList.remove('active');
                btn.innerText = 'AUTO: OFF';
            }
        });

        document.getElementById('btnChangeNickname').addEventListener('click', () => {
            const newNick = prompt('사용할 닉네임을 입력하세요 (최대 12자):', nickname);
            if (newNick && newNick.trim().length > 0) {
                nickname = newNick.trim().substring(0, 12);
                saveData();
                updateDisplay();
                syncLeaderboard();
            }
        });

        document.getElementById('btnOpenCollection').addEventListener('click', () => {
            document.getElementById('searchCollection').value = '';
            renderCollection();
            document.getElementById('collectionModal').classList.add('open');
        });

        document.getElementById('btnCloseCollection').addEventListener('click', () => {
            document.getElementById('collectionModal').classList.remove('open');
        });

        document.getElementById('btnOpenLeaderboard').addEventListener('click', () => {
            renderLeaderboard();
            document.getElementById('leaderboardModal').classList.add('open');
        });

        document.getElementById('btnCloseLeaderboard').addEventListener('click', () => {
            document.getElementById('leaderboardModal').classList.remove('open');
        });

        updateDisplay();
    </script>
</body>
</html>
